name: Keep Streamlit Awake (Hybrid_Option_Pricer)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-awake:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.49.1
          python -m playwright install --with-deps chromium

      - name: Open app and wake if sleeping
        env:
          STREAMLIT_APP_URL: https://hybrid-pricer.streamlit.app
        run: |
          python - << 'EOF'
          import asyncio
          import os
          from playwright.async_api import async_playwright, TimeoutError as PlaywrightTimeoutError

          APP_URL = os.environ["STREAMLIT_APP_URL"]
          WAKE_TEXT = "Yes, get this app back up!"
          READY_TEXT = "Hybrid Option Pricer"

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  page = await browser.new_page(viewport={"width": 1440, "height": 1000})

                  print(f"Opening {APP_URL}")
                  await page.goto(APP_URL, wait_until="domcontentloaded", timeout=120000)
                  await page.wait_for_timeout(5000)

                  wake_button = page.get_by_role("button", name=WAKE_TEXT)
                  if await wake_button.count() > 0:
                      print("Streamlit sleep screen detected. Clicking wake-up button.")
                      await wake_button.first.click(timeout=30000)
                      try:
                          await page.wait_for_load_state("networkidle", timeout=120000)
                      except PlaywrightTimeoutError:
                          print("Network did not become fully idle after wake click; checking app text anyway.")
                      await page.wait_for_timeout(30000)
                      try:
                          await page.get_by_text(READY_TEXT).first.wait_for(timeout=120000)
                      except PlaywrightTimeoutError as exc:
                          raise RuntimeError(
                              f"Wake-up click completed, but expected dashboard text was not found: {READY_TEXT}"
                          ) from exc
                      print("Dashboard text detected after wake-up.")
                  else:
                      print("Wake-up button not present. App appears awake or already starting; no wake-specific assertion needed.")

                  print(f"Page title: {await page.title()}")
                  await browser.close()

          asyncio.run(main())
          EOF
