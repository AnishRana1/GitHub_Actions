name: Determinism Checker (PulseGuard_Risk_Monitor_Model)

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: pulseguard-determinism-check
  cancel-in-progress: false

jobs:
  check-determinism:
    runs-on: ubuntu-22.04
    env:
      PYTHONHASHSEED: "42"
      PULSEGUARD_SEED: "42"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      XGBOOST_NUM_THREADS: "1"
      LIGHTGBM_NUM_THREADS: "1"
      CUBLAS_WORKSPACE_CONFIG: ":4096:8"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: "pip"
          cache-dependency-path: PulseGuard_Risk_Monitor_Model/requirements.txt

      - name: Install dependencies
        working-directory: PulseGuard_Risk_Monitor_Model
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run deterministic output check
        working-directory: PulseGuard_Risk_Monitor_Model
        run: python scripts/check_deployed_determinism.py
